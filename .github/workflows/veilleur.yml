name: Veilleur agent finances

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: veilleur
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Surveiller les marchés
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ROUTINE_FIRE_URL: https://api.anthropic.com/v1/claude_code/routines/trig_01BWR1DohCFFyDdvoS4VMArs/fire
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 veilleur.py
      - name: Garder la mémoire des alertes
        run: |
          git config user.name "veilleur"
          git config user.email "veilleur@users.noreply.github.com"
          git add state.json signaux.json resume.md
          git diff --cached --quiet || (git commit -m "Mémoire du veilleur" && git push)
